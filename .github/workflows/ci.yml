# Единственный workflow проекта. Запускается ТОЛЬКО на pull_request
# (никаких push / workflow_dispatch / schedule). Один job — один прогон на событие PR.
# Только статические проверки, сборка и проверки содержимого репозитория: ядра 1С-Битрикс
# в репозитории нет (лицензия, размер), поэтому PHPUnit и Playwright запускаются локально
# на стенде Docker — см. docs/testing.md. PHPStan проверяет /local и tests по стабам API ядра
# (local/stubs/{main,iblock,catalog,sale}.stub.php), ядро для этого не нужно.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks проверяет всю историю

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, gd, zip, mbstring
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=1G, upload_max_filesize=8M, post_max_size=10M

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: No core and no passwords in the repository
        run: docker/check-repo.sh

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Composer validate
        run: composer validate --strict

      - name: php-cs-fixer
        run: composer cs:check

      - name: PHPStan (level max, stubs)
        run: composer stan

      - name: TypeScript typecheck
        run: npm run types:check

      - name: ESLint
        run: npm run lint:check

      - name: Prettier
        run: npm run format:check

      - name: Build assets (Vite)
        run: npm run build
